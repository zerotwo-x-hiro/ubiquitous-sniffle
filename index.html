    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b13" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kdramaworld-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === "dark" ? "#070b13" : "#fbf5e9";
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="KDramaWorld — A cinematic Korean drama discovery experience. Catalogues, ratings, posters and editorial picks, sourced live." />
